<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh Sách Sản Phẩm Nội Thất</h2>
        <div>
            <a th:href="@{/categories}" class="btn btn-outline-secondary me-2">Quản lý Danh mục</a>
            <a th:href="@{/products/add}" class="btn btn-primary">+ Thêm Sản Phẩm Mới</a>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th style="width: 60px;">ID</th>
                <th>Hình Ảnh</th>
                <th>Tên Sản Phẩm</th>
                <th>Giá Cả</th>
                <th>Mô Tả</th>
                <th>Danh Mục</th>
                <th style="width: 160px;">Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="product : ${products}">
                <td th:text="${product.id}">1</td>
                <td style="width: 90px; text-align: center;">
                    <img th:src="${product.image}" alt="ảnh" style="width: 60px; height: 60px; object-fit: cover; border-radius: 6px;"
                         onerror="this.src='https://placehold.co/60x60?text=No+Img'">
                </td>
                <td class="fw-bold" th:text="${product.name}">Tên sản phẩm</td>
                <td class="text-danger fw-bold" th:text="${product.formattedPrice}">0 đ</td>
                <td th:text="${product.description}" style="max-width: 250px;">Mô tả...</td>
                <td>
                    <span class="badge bg-info text-dark" th:text="${product.category != null ? product.category.name : 'Chưa phân loại'}">Danh mục</span>
                </td>
                <td>
                    <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-success btn-sm me-1">Sửa</a>
                    <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này không?');">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="7" class="text-center text-muted">Chưa có sản phẩm nào trong CSDL!</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
