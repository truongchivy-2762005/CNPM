<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Sản Phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4" style="max-width: 700px;">
    <h2 class="mb-3">Thêm Sản Phẩm Mới</h2>
    <form th:action="@{/products/add}" th:object="${product}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label">Tên sản phẩm:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="Ví dụ: Sofa da thật...">
        </div>
        <div class="mb-3">
            <label for="price" class="form-label">Giá (VNĐ):</label>
            <input type="number" step="10000" id="price" th:field="*{price}" class="form-control" required placeholder="Ví dụ: 12500000">
        </div>
        <div class="mb-3">
            <label for="category" class="form-label">Danh mục:</label>
            <select id="category" th:field="*{category}" class="form-select" required>
                <option value="">-- Chọn danh mục --</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
            </select>
        </div>
        <div class="mb-3">
            <label for="image" class="form-label">Link hình ảnh (URL):</label>
            <input type="text" id="image" th:field="*{image}" class="form-control" placeholder="https://images.unsplash.com/...">
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Mô tả sản phẩm:</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Xác nhận thêm</button>
        <a th:href="@{/products}" class="btn btn-secondary">Hủy bỏ</a>
    </form>
</body>
</html>
