<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Thêm Danh Mục</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4" style="max-width: 600px;">
    <h2 class="mb-3">Thêm Danh Mục Mới</h2>
    <form th:action="@{/categories/add}" th:object="${category}" method="post">
        <div class="mb-3">
            <label for="name" class="form-label font-weight-bold">Tên danh mục:</label>
            <input type="text" id="name" th:field="*{name}" class="form-control" required placeholder="Nhập tên danh mục...">
        </div>
        <button type="submit" class="btn btn-primary">Xác nhận lưu</button>
        <a th:href="@{/categories}" class="btn btn-secondary">Hủy bỏ</a>
    </form>
</body>
</html>
