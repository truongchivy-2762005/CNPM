<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Danh Sách Danh Mục</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Danh Sách Danh Mục Nội Thất</h2>
        <div>
            <a th:href="@{/products}" class="btn btn-outline-secondary me-2">Quản lý Sản phẩm</a>
            <a th:href="@{/categories/add}" class="btn btn-primary">+ Thêm Danh Mục Mới</a>
        </div>
    </div>

    <table class="table table-bordered table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th style="width: 80px;">ID</th>
                <th>Tên Danh Mục</th>
                <th style="width: 180px;">Hành Động</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.id}">1</td>
                <td th:text="${category.name}">Tên</td>
                <td>
                    <a th:href="@{/categories/edit/{id}(id=${category.id})}" class="btn btn-success btn-sm me-1">Sửa</a>
                    <a th:href="@{/categories/delete/{id}(id=${category.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('Bạn có chắc chắn muốn xóa danh mục này không?');">Xóa</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(categories)}">
                <td colspan="3" class="text-center text-muted">Chưa có danh mục nào. Hãy nhấn thêm mới!</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
